<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>auramaxx – your lifemaxxing tracker</title>
<meta name="description" content="Track habits, food, workouts, sleep and progress photos. Farm Aura, level up and share your day.">
<meta name="theme-color" content="#09090d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="auramaxx">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<header class="topbar">
  <div class="topbar-in">
    <span class="brand">aura<span>maxx</span></span>
    <button type="button" class="level-chip" id="levelChip" data-action="nav" data-view="progress" data-k="levelchip"></button>
    <button type="button" class="icon-btn" data-action="settings" data-i18n-aria="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="main" class="app" tabindex="-1">
  <div class="datebar" id="datebar">
    <button type="button" class="icon-btn" id="datePrev" data-action="date-prev" data-k="dprev" data-i18n-aria="prevDay" aria-label="Previous day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="date-mid">
      <b id="dateLabel" aria-live="polite"></b>
      <span id="dateSub"></span>
      <button type="button" class="date-today" id="dateToday" data-action="date-today" data-i18n="backToToday">Back to today</button>
    </div>
    <button type="button" class="icon-btn" id="dateNext" data-action="date-next" data-k="dnext" data-i18n-aria="nextDay" aria-label="Next day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <section class="view" id="view-today" data-i18n-aria="today" aria-label="Today"></section>
  <section class="view" id="view-habits" data-i18n-aria="habits" aria-label="Habits" hidden></section>
  <section class="view" id="view-food" data-i18n-aria="food" aria-label="Food" hidden></section>
  <section class="view" id="view-train" data-i18n-aria="training" aria-label="Training" hidden></section>
  <section class="view" id="view-progress" data-i18n-aria="progress" aria-label="Progress" hidden></section>
</main>

<nav class="tabbar" data-i18n-aria="mainNav" aria-label="Main navigation">
  <div class="tabbar-in">
    <button type="button" class="tab" data-action="nav" data-view="today" data-k="tab-today">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span data-i18n="today">Today</span>
    </button>
    <button type="button" class="tab" data-action="nav" data-view="habits" data-k="tab-habits">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg></span><span data-i18n="habits">Habits</span>
    </button>
    <button type="button" class="tab" data-action="nav" data-view="food" data-k="tab-food">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2-3-7-2.5-7 2.5C5 15 9 21 12 21s7-6 7-11.5C19 4.5 14 4 12 7z"/><path d="M12 7c0-2 1-4 3-5"/></svg></span><span data-i18n="food">Food</span>
    </button>
    <button type="button" class="tab" data-action="nav" data-view="train" data-k="tab-train">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span><span data-i18n="training">Training</span>
    </button>
    <button type="button" class="tab" data-action="nav" data-view="progress" data-k="tab-progress">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-4M11 16V8M16 16v-6M21 4l-5 5-3-3-4 4"/></svg></span><span data-i18n="progress">Progress</span>
    </button>
  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<datalist id="exList"></datalist>

<!-- Onboarding -->
<dialog id="dlgOnboard" aria-labelledby="oTitle">
  <form class="sheet" id="formOnboard">
    <div class="grip" aria-hidden="true"></div>
    <fieldset>
      <legend class="sr-only" data-i18n="language">Language</legend>
      <div class="seg lang-seg" id="oLang"></div>
    </fieldset>
    <h2 id="oTitle"><span data-i18n="welcome">Welcome to</span> aura<span style="color:var(--accent-text)">maxx</span></h2>
    <p class="lead" data-i18n="onboardLead"></p>
    <label class="field"><span data-i18n="askName">What should we call you?</span>
      <input id="oName" type="text" maxlength="24" autocomplete="given-name" data-i18n-ph="namePh">
    </label>
    <fieldset>
      <legend data-i18n="pickHabits">Pick your first habits</legend>
      <div class="chips" id="oHabits"></div>
      <p class="hint" style="margin-top:8px" data-i18n="changeLater"></p>
    </fieldset>
    <div class="row-fields">
      <label class="field"><span><span data-i18n="waterPerDay">Water per day</span> <span class="opt" data-i18n="glasses250"></span></span>
        <input id="oWater" type="number" inputmode="numeric" min="2" max="20" value="8">
      </label>
      <label class="field"><span><span data-i18n="proteinGoal">Protein goal</span> <span class="opt" data-i18n="gramsOptional"></span></span>
        <input id="oProtein" type="number" inputmode="numeric" min="0" max="400" data-i18n-ph="egProtein">
      </label>
    </div>
    <button type="submit" class="btn btn-primary wide" data-i18n="letsGoBtn">Let’s go</button>
  </form>
</dialog>

<!-- Habit -->
<dialog id="dlgHabit" aria-labelledby="hTitle">
  <form class="sheet" id="formHabit">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="hTitle"></h2>
    <div class="row2">
      <label class="field emoji-field"><span data-i18n="emoji">Emoji</span>
        <input id="hEmoji" type="text" maxlength="8" autocomplete="off">
      </label>
      <label class="field"><span data-i18n="name">Name</span>
        <input id="hName" type="text" maxlength="30" autocomplete="off" data-i18n-ph="habitNamePh" required>
      </label>
    </div>
    <div class="emoji-pick" id="hEmojiPick" role="group" data-i18n-aria="pickEmoji"></div>
    <label class="field"><span><span data-i18n="goal">Goal</span> <span class="opt" data-i18n="optional"></span></span>
      <input id="hGoal" type="text" maxlength="40" autocomplete="off" data-i18n-ph="goalPh">
    </label>
    <fieldset>
      <legend data-i18n="area">Area</legend>
      <div class="seg" id="hCat"></div>
    </fieldset>
    <fieldset>
      <legend data-i18n="perWeekQ">How many days a week?</legend>
      <div class="seg grid7" id="hFreq"></div>
      <p class="hint" id="hFreqNote" style="margin-top:8px"></p>
    </fieldset>
    <div class="actions">
      <button type="button" class="btn danger" id="hDelete"></button>
      <span class="grow"></span>
      <button type="button" class="btn" data-close data-i18n="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="hSave"></button>
    </div>
  </form>
</dialog>

<!-- Meal -->
<dialog id="dlgMeal" aria-labelledby="mTitle">
  <form class="sheet" id="formMeal">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="mTitle"></h2>
    <div id="mRecent"></div>
    <fieldset>
      <legend data-i18n="meal">Meal</legend>
      <div class="seg" id="mType"></div>
    </fieldset>
    <label class="field"><span data-i18n="whatEat">What did you eat?</span>
      <input id="mName" type="text" maxlength="60" autocomplete="off" data-i18n-ph="mealPh" required>
    </label>
    <div class="row-fields">
      <label class="field"><span data-i18n="time">Time</span>
        <input id="mTime" type="time">
      </label>
      <label class="field"><span><span data-i18n="protein">Protein</span> <span class="opt">g</span></span>
        <input id="mProtein" type="number" inputmode="decimal" min="0" max="300" step="1" data-i18n-ph="optional">
      </label>
    </div>
    <label class="field"><span><span data-i18n="calories">Calories</span> <span class="opt" data-i18n="caloriesOpt"></span></span>
      <input id="mKcal" type="number" inputmode="numeric" min="0" max="5000" step="1" placeholder="kcal">
    </label>
    <fieldset>
      <legend data-i18n="tags">Tags</legend>
      <div class="seg" id="mTags"></div>
    </fieldset>
    <div class="actions">
      <button type="button" class="btn danger" id="mDelete"></button>
      <span class="grow"></span>
      <button type="button" class="btn" data-close data-i18n="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="mSave" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<!-- Workout -->
<dialog id="dlgWorkout" aria-labelledby="wTitle">
  <form class="sheet" id="formWorkout">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="wTitle"></h2>
    <fieldset>
      <legend data-i18n="type">Type</legend>
      <div class="seg" id="wType"></div>
    </fieldset>
    <div class="row-fields">
      <label class="field"><span><span data-i18n="duration">Duration</span> <span class="opt" data-i18n="minutes"></span></span>
        <input id="wDur" type="number" inputmode="numeric" min="1" max="600" required>
      </label>
      <label class="field"><span data-i18n="time">Time</span>
        <input id="wTime" type="time">
      </label>
    </div>
    <fieldset>
      <legend><span data-i18n="howHard">How hard was it?</span> <span class="opt" data-i18n="howHardScale"></span></legend>
      <div class="seg grid5" id="wInt"></div>
    </fieldset>
    <label class="field" id="wDistWrap"><span><span data-i18n="distance">Distance</span> <span class="opt" data-i18n="kmOptional"></span></span>
      <input id="wDist" type="number" inputmode="decimal" min="0" max="500" step="0.1" data-i18n-ph="egDist">
    </label>
    <fieldset id="wExWrap">
      <legend data-i18n="exercisesTitle">Exercises</legend>
      <div class="ex-head" aria-hidden="true"><span data-i18n="exCol">Exercise</span><span data-i18n="setsCol">Sets</span><span data-i18n="repsCol">Reps</span><span>kg</span><span></span></div>
      <div class="ex-rows" id="wEx"></div>
      <button type="button" class="btn sm" id="wAddEx" style="margin-top:10px" data-i18n="addExercise">+ Exercise</button>
    </fieldset>
    <label class="field"><span><span data-i18n="note">Note</span> <span class="opt" data-i18n="optional"></span></span>
      <textarea id="wNote" rows="2" maxlength="500" data-i18n-ph="notePh"></textarea>
    </label>
    <div class="actions">
      <button type="button" class="btn danger" id="wDelete"></button>
      <span class="grow"></span>
      <button type="button" class="btn" data-close data-i18n="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" id="wSave" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<!-- View photo -->
<dialog id="dlgPhoto" aria-labelledby="pTitle">
  <div class="sheet">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="pTitle"></h2>
    <img id="pImg" class="photo-full" alt="">
    <div class="actions">
      <button type="button" class="btn danger" id="pDelete"></button>
      <span class="grow"></span>
      <button type="button" class="btn btn-primary" data-close data-i18n="done">Done</button>
    </div>
  </div>
</dialog>

<!-- Share -->
<dialog id="dlgShare" aria-labelledby="sTitle">
  <div class="sheet">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="sTitle" data-i18n="dayCard">Your day card</h2>
    <p class="lead" data-i18n="dayCardLead"></p>
    <img id="shareImg" class="share-img" alt="">
    <p class="hint" id="shareStatus" role="status" style="text-align:center"></p>
    <div class="actions">
      <button type="button" class="btn" data-close data-i18n="close">Close</button>
      <span class="grow"></span>
      <a class="btn" id="shareDl" href="#" download="auramaxx.png" data-i18n="saveImage">Save image</a>
      <button type="button" class="btn btn-primary" id="shareBtn" hidden data-i18n="share">Share</button>
    </div>
  </div>
</dialog>

<!-- Settings -->
<dialog id="dlgSettings" aria-labelledby="setTitle">
  <form class="sheet" id="formSettings">
    <div class="grip" aria-hidden="true"></div>
    <h2 id="setTitle" data-i18n="settings">Settings</h2>
    <fieldset>
      <legend data-i18n="language">Language</legend>
      <div class="seg lang-seg" id="sLang"></div>
    </fieldset>
    <label class="field"><span data-i18n="name">Name</span>
      <input id="sName" type="text" maxlength="24" autocomplete="given-name">
    </label>
    <div class="row-fields">
      <label class="field"><span><span data-i18n="waterGoalS">Water goal</span> <span class="opt" data-i18n="glassesOpt"></span></span>
        <input id="sWater" type="number" inputmode="numeric" min="2" max="20">
      </label>
      <label class="field"><span><span data-i18n="proteinGoal">Protein goal</span> <span class="opt" data-i18n="protOff"></span></span>
        <input id="sProtein" type="number" inputmode="numeric" min="0" max="400">
      </label>
    </div>
    <label class="field"><span data-i18n="workoutsPerWeek">Workouts per week</span>
      <input id="sWorkouts" type="number" inputmode="numeric" min="1" max="14">
    </label>
    <fieldset>
      <legend data-i18n="theme">Theme</legend>
      <div class="seg" id="sTheme">
        <label><input type="radio" name="theme" value="auto"><span data-i18n="themeSystem">System</span></label>
        <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark">Dark</span></label>
        <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight">Light</span></label>
      </div>
    </fieldset>
    <div class="card" style="padding:14px;box-shadow:none">
      <p class="small muted" data-i18n="dataNote"></p>
      <div class="actions" style="margin-top:10px">
        <button type="button" class="btn sm" id="sExport" data-i18n="exportBackup">Export backup</button>
        <button type="button" class="btn sm" id="sImport" data-i18n="importBackup">Import backup</button>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="sReset"></button>
      <span class="grow"></span>
      <button type="button" class="btn" data-close data-i18n="cancel">Cancel</button>
      <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
