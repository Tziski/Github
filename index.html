<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: eine schmale Spalte. Oben der Tagesbogen, auf dem die Sonne mit jeder erledigten Gewohnheit weiterwandert, darunter eine ruhige Liste. */
:root {
  --sky: #e9eef8;
  --surface: #f7f9fd;
  --ink: #16203b;
  --muted: #5f6984;
  --line: #d3dae9;
  --track: #d6deee;
  --sun: #f5a524;
  --sun-ink: #16203b;
  --danger: #b4372b;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0e1428; --surface: #161e38; --ink: #eaeef8; --muted: #949db8;
    --line: #27305a; --track: #232c4d; --sun: #ffb940; --sun-ink: #1a1404; --danger: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0e1428; --surface: #161e38; --ink: #eaeef8; --muted: #949db8;
  --line: #27305a; --track: #232c4d; --sun: #ffb940; --sun-ink: #1a1404; --danger: #ff8a7a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; border-radius: 8px; }

.app {
  max-width: 460px;
  margin: 0 auto;
  padding-block: max(18px, env(safe-area-inset-top, 0px)) 64px;
}

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 700 18px/1 var(--display); letter-spacing: -0.3px; }
.add {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1.5px solid var(--ink); background: transparent;
  border-radius: 99px; padding: 8px 14px 8px 11px; font-weight: 600; cursor: pointer;
}
.add svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }

/* Tagesbogen */
.day-head { margin-top: 28px; }
.weekday { margin: 0; color: var(--muted); font-weight: 500; }
.date { margin: 2px 0 0; font: 700 clamp(30px, 9vw, 40px)/1.05 var(--display); letter-spacing: -1px; text-wrap: balance; }

.arc { position: relative; margin: 18px auto 4px; max-width: 360px; }
.arc svg { display: block; width: 100%; height: auto; overflow: visible; }
.arc .horizon { stroke: var(--line); stroke-width: 1.5; }
.arc .track { fill: none; stroke: var(--track); stroke-width: 10; stroke-linecap: round; }
.arc .fill { fill: none; stroke: var(--sun); stroke-width: 10; stroke-linecap: round; }
.arc .halo { fill: var(--sun); opacity: .22; }
.arc .core { fill: var(--sun); }
.arc .rays line { stroke: var(--sun); stroke-width: 3; stroke-linecap: round; }
.arc .rays { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; transition: transform .6s cubic-bezier(.2, 1.6, .4, 1), opacity .3s; }
.complete .arc .rays { transform: scale(1); opacity: 1; }

.score {
  position: absolute; left: 0; right: 0; bottom: 6px;
  text-align: center; display: grid; gap: 2px;
}
.score b { font: 700 40px/1 var(--display); letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: 14px; }

/* Liste */
.list-head { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 6px; }
.list-head h2 { margin: 0; font: 500 15px/1.2 var(--display); }
.list-head p { margin: 0; color: var(--muted); font-size: 13px; }

.habits { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 24px; border: 1px solid var(--line); }
.habit {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  column-gap: 14px; row-gap: 10px;
  align-items: center;
  padding: 16px 16px 14px;
}
.habit + .habit { border-top: 1px solid var(--line); }

.tick {
  width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid var(--ink); background: transparent; cursor: pointer;
  display: grid; place-items: center;
  transition: background-color .2s, border-color .2s, transform .12s;
}
.tick svg { width: 22px; height: 22px; fill: none; stroke: var(--sun-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s ease-out .05s; }
.tick[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); }
.tick[aria-pressed="true"] svg { stroke-dashoffset: 0; }
.tick:active { transform: scale(.9); }

.meta { min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.h-name { display: block; font-weight: 600; font-size: 18px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-goal { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.streak { text-align: right; line-height: 1; }
.streak b { display: block; font: 700 24px/1 var(--display); font-variant-numeric: tabular-nums; }
.streak span { font-size: 12px; color: var(--muted); }

.days { grid-column: 2 / 4; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.d {
  border: 0; background: none; padding: 4px 0 0; cursor: pointer;
  display: grid; gap: 5px; justify-items: stretch; text-align: center;
}
.d i { display: block; height: 7px; border-radius: 4px; background: var(--track); transition: background-color .2s; }
.d span { font-size: 11px; color: var(--muted); }
.d.done i { background: var(--ink); }
.d.today span { color: var(--ink); font-weight: 600; }
.d.today i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--sun); }
.d:disabled { cursor: default; }
.d:disabled i { opacity: .45; }
.week-note { grid-column: 2 / 4; margin: -2px 0 0; font-size: 12px; color: var(--muted); }

.empty { text-align: center; padding: 36px 20px; color: var(--muted); }
.hint { margin: 14px 4px 0; font-size: 13px; color: var(--muted); }

/* Bearbeiten */
dialog {
  border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 460px;
  background: var(--surface); color: var(--ink);
  border-radius: 26px 26px 0 0;
}
@media (min-width: 560px) { dialog { margin: auto; border-radius: 26px; } }
dialog::backdrop { background: rgba(10, 14, 30, .5); }
.sheet {
  display: grid; gap: 16px;
  padding: 22px max(20px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.sheet h2 { margin: 0; font: 700 22px/1.2 var(--display); }
.field { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
.field input {
  font: inherit; font-weight: 400; font-size: 16px;
  padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line);
  background: var(--sky); color: var(--ink);
}
.field input:focus { outline: none; border-color: var(--sun); }
fieldset { border: 0; margin: 0; padding: 0; }
legend { font-weight: 600; font-size: 14px; padding: 0; margin-bottom: 6px; }
.freq { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.freq input { position: absolute; opacity: 0; pointer-events: none; }
.freq span {
  display: grid; place-items: center; height: 42px; border-radius: 12px;
  border: 1.5px solid var(--line); font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
}
.freq input:checked + span { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.freq input:focus-visible + span { outline: 2px solid var(--sun); outline-offset: 2px; }
.freq-note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.actions .grow { flex: 1; }
.btn { border-radius: 99px; padding: 11px 18px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--line); background: transparent; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.delete { border-color: transparent; color: var(--danger); padding-inline: 6px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <span class="brand">tagwerk</span>
    <button class="add" id="addBtn" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12"/></svg>Neu
    </button>
  </header>

  <section class="day-head">
    <p class="weekday" id="weekday"></p>
    <h1 class="date" id="date"></h1>
  </section>

  <div class="arc" aria-hidden="true">
    <svg viewBox="0 0 320 172">
      <line class="horizon" x1="0" y1="160" x2="320" y2="160"/>
      <path class="track" d="M20 160 A140 140 0 0 1 300 160" pathLength="100"/>
      <path class="fill" id="arcFill" d="M20 160 A140 140 0 0 1 300 160" pathLength="100" stroke-dasharray="0 100"/>
      <g id="sun" transform="translate(20 160)">
        <g class="rays">
          <line x1="0" y1="-24" x2="0" y2="-31"/><line x1="0" y1="24" x2="0" y2="31"/>
          <line x1="-24" y1="0" x2="-31" y2="0"/><line x1="24" y1="0" x2="31" y2="0"/>
          <line x1="17" y1="17" x2="22" y2="22"/><line x1="-17" y1="-17" x2="-22" y2="-22"/>
          <line x1="17" y1="-17" x2="22" y2="-22"/><line x1="-17" y1="17" x2="-22" y2="22"/>
        </g>
        <circle class="halo" r="20"/>
        <circle class="core" r="12"/>
      </g>
    </svg>
    <div class="score"><b id="score">0/0</b><span id="scoreNote"></span></div>
  </div>

  <div class="list-head">
    <h2>Heute</h2>
    <p id="weekLabel"></p>
  </div>
  <ul class="habits" id="list"></ul>
  <p class="hint" id="hint">Tippe auf einen Namen, um ihn zu ändern. Vergessene Tage trägst du über die Wochenbalken nach.</p>
</main>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form class="sheet" id="form">
    <h2 id="sheetTitle">Neue Gewohnheit</h2>
    <label class="field">Name
      <input id="fName" type="text" maxlength="28" placeholder="Lesen" autocomplete="off" required>
    </label>
    <label class="field">Ziel
      <input id="fGoal" type="text" maxlength="32" placeholder="20 Seiten" autocomplete="off">
    </label>
    <fieldset>
      <legend>Tage pro Woche</legend>
      <div class="freq" id="freq"></div>
      <p class="freq-note" id="freqNote"></p>
    </fieldset>
    <div class="actions">
      <button class="btn delete" id="deleteBtn" type="button">Löschen</button>
      <span class="grow"></span>
      <button class="btn" id="cancelBtn" type="button">Abbrechen</button>
      <button class="btn primary" id="saveBtn" type="submit">Speichern</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  'use strict';

  var KEY = 'tagwerk.v2';
  var DAYS = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
  var SHORT = ['M', 'D', 'M', 'D', 'F', 'S', 'S'];
  var MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Datum */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function day0(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function add(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function monday(d) { var x = day0(d); return add(x, -((x.getDay() + 6) % 7)); }
  function weekNo(d) {
    var t = day0(d); t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var j = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - j) / 864e5 - 3 + ((j.getDay() + 6) % 7)) / 7);
  }

  /* Daten */
  function uid() { return 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function past(list) { var t = day0(new Date()); return list.map(function (n) { return iso(add(t, -n)); }); }
  function seed() {
    return [
      { id: uid(), name: 'Lesen', goal: '20 Seiten', perWeek: 7, done: past([1, 2, 3, 4]) },
      { id: uid(), name: 'Sport', goal: '45 Minuten', perWeek: 4, done: past([2, 5, 7, 9, 11]) },
      { id: uid(), name: 'Wasser trinken', goal: '2 Liter', perWeek: 7, done: past([0, 1, 2]) },
      { id: uid(), name: 'Handy weg', goal: 'ab 22 Uhr', perWeek: 5, done: past([1]) }
    ];
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var p = JSON.parse(raw); if (Array.isArray(p)) return p; }
    } catch (e) {}
    return seed();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch (e) {} }
  var habits = load();

  /* Logik */
  function has(h, d) { return h.done.indexOf(d) !== -1; }
  function flip(h, d) { var i = h.done.indexOf(d); if (i < 0) h.done.push(d); else h.done.splice(i, 1); }
  function countWeek(h, mon) { var c = 0; for (var i = 0; i < 7; i++) if (has(h, iso(add(mon, i)))) c++; return c; }
  function streak(h) {
    var t = day0(new Date()), n = 0;
    if (h.perWeek >= 7) {
      var d = has(h, iso(t)) ? t : add(t, -1);
      while (has(h, iso(d)) && n < 3650) { n++; d = add(d, -1); }
      return { n: n, unit: n === 1 ? 'Tag' : 'Tage' };
    }
    var w = monday(t);
    if (countWeek(h, w) >= h.perWeek) n++;
    w = add(w, -7);
    while (countWeek(h, w) >= h.perWeek && n < 520) { n++; w = add(w, -7); }
    return { n: n, unit: n === 1 ? 'Woche' : 'Wochen' };
  }
  function dueToday(h) {
    var t = iso(day0(new Date()));
    return h.perWeek >= 7 || has(h, t) || countWeek(h, monday(new Date())) < h.perWeek;
  }

  /* Sonne */
  var shown = 0, anim = null;
  function placeSun(p) {
    var a = Math.PI * (1 - p);
    var x = 160 + 140 * Math.cos(a), y = 160 - 140 * Math.sin(a);
    document.getElementById('sun').setAttribute('transform', 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
    document.getElementById('arcFill').setAttribute('stroke-dasharray', (p * 100).toFixed(2) + ' 100');
  }
  function moveSun(target) {
    if (anim) cancelAnimationFrame(anim);
    if (reduceMotion) { shown = target; placeSun(target); return; }
    var from = shown, start = null, dur = 700;
    function step(ts) {
      if (start === null) start = ts;
      var k = Math.min(1, (ts - start) / dur), e = 1 - Math.pow(1 - k, 3);
      shown = from + (target - from) * e;
      placeSun(shown);
      if (k < 1) anim = requestAnimationFrame(step);
    }
    anim = requestAnimationFrame(step);
  }

  /* Anzeige */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function row(h) {
    var t = day0(new Date()), ti = iso(t), mon = monday(t), s = streak(h);
    var cells = '';
    for (var i = 0; i < 7; i++) {
      var d = add(mon, i), di = iso(d), fut = d > t;
      var cls = 'd' + (has(h, di) ? ' done' : '') + (di === ti ? ' today' : '');
      cells += '<button type="button" class="' + cls + '" data-id="' + h.id + '" data-date="' + di + '"' + (fut ? ' disabled' : '') +
        ' aria-label="' + DAYS[i] + (has(h, di) ? ', erledigt' : ', offen') + '"><i></i><span>' + SHORT[i] + '</span></button>';
    }
    var note = h.perWeek < 7 ? '<p class="week-note">' + countWeek(h, mon) + ' von ' + h.perWeek + ' Tagen diese Woche</p>' : '';
    var on = has(h, ti);
    return '<li class="habit">' +
      '<button type="button" class="tick" data-tick="' + h.id + '" aria-pressed="' + on + '" aria-label="' + esc(h.name) + ' heute erledigt">' +
        '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>' +
      '<button type="button" class="meta" data-edit="' + h.id + '"><span class="h-name">' + esc(h.name) + '</span>' +
        '<span class="h-goal">' + esc(h.goal || (h.perWeek >= 7 ? 'täglich' : h.perWeek + ' Tage pro Woche')) + '</span></button>' +
      '<div class="streak"><b>' + s.n + '</b><span>' + s.unit + '</span></div>' +
      '<div class="days">' + cells + '</div>' + note +
    '</li>';
  }

  function render() {
    var now = new Date();
    $('weekday').textContent = DAYS[(now.getDay() + 6) % 7];
    $('date').textContent = now.getDate() + '. ' + MONTHS[now.getMonth()];
    $('weekLabel').textContent = 'Woche ' + weekNo(now);

    var t = iso(day0(now)), due = 0, done = 0;
    habits.forEach(function (h) { if (dueToday(h)) { due++; if (has(h, t)) done++; } });

    if (habits.length) {
      $('list').innerHTML = habits.map(row).join('');
      $('hint').hidden = false;
    } else {
      $('list').innerHTML = '<li class="empty">Noch keine Gewohnheiten. Lege mit „Neu“ die erste an, zum Beispiel 10 Minuten Lesen.</li>';
      $('hint').hidden = true;
    }

    $('score').textContent = done + '/' + due;
    var complete = due > 0 && done === due;
    $('scoreNote').textContent = due === 0 ? 'heute nichts geplant' : complete ? 'Tag geschafft' : 'heute erledigt';
    $('app').classList.toggle('complete', complete);
    moveSun(due ? done / due : 0);
  }

  function find(id) { for (var i = 0; i < habits.length; i++) if (habits[i].id === id) return habits[i]; return null; }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var h;
    if (b.dataset.tick) { h = find(b.dataset.tick); if (h) { flip(h, iso(day0(new Date()))); save(); render(); } }
    else if (b.dataset.date && !b.disabled) { h = find(b.dataset.id); if (h) { flip(h, b.dataset.date); save(); render(); } }
    else if (b.dataset.edit) { open(find(b.dataset.edit)); }
  });

  /* Bearbeiten */
  var sheet = $('sheet'), editing = null, armed = false;
  (function () {
    var html = '';
    for (var n = 1; n <= 7; n++) html += '<label><input type="radio" name="freq" id="freq' + n + '" value="' + n + '"><span>' + n + '</span></label>';
    $('freq').innerHTML = html;
  })();
  function freqNote() {
    var c = document.querySelector('input[name=freq]:checked');
    var n = c ? +c.value : 7;
    $('freqNote').textContent = n === 7 ? 'Jeden Tag' : n === 1 ? 'Einmal pro Woche' : n + ' Tage pro Woche, du wählst welche';
  }
  $('freq').addEventListener('change', freqNote);

  function disarm() { armed = false; $('deleteBtn').textContent = 'Löschen'; }
  function open(h) {
    editing = h || null; disarm();
    $('sheetTitle').textContent = h ? 'Gewohnheit bearbeiten' : 'Neue Gewohnheit';
    $('saveBtn').textContent = h ? 'Speichern' : 'Hinzufügen';
    $('fName').value = h ? h.name : '';
    $('fGoal').value = h ? (h.goal || '') : '';
    $('freq' + (h ? h.perWeek : 7)).checked = true;
    freqNote();
    $('deleteBtn').hidden = !h;
    sheet.showModal();
    if (!h) $('fName').focus();
  }
  $('addBtn').addEventListener('click', function () { open(null); });
  $('cancelBtn').addEventListener('click', function () { sheet.close(); });
  sheet.addEventListener('click', function (e) { if (e.target === sheet) sheet.close(); });

  $('deleteBtn').addEventListener('click', function () {
    if (!editing) return;
    if (!armed) { armed = true; this.textContent = 'Wirklich löschen?'; return; }
    var id = editing.id;
    habits = habits.filter(function (h) { return h.id !== id; });
    save(); sheet.close(); render();
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('fName').value.trim(); if (!name) { $('fName').focus(); return; }
    var goal = $('fGoal').value.trim();
    var per = +document.querySelector('input[name=freq]:checked').value || 7;
    if (editing) { editing.name = name; editing.goal = goal; editing.perWeek = per; }
    else habits.push({ id: uid(), name: name, goal: goal, perWeek: per, done: [] });
    save(); sheet.close(); render();
  });

  render();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
