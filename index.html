<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4">
  <title>Tagwerk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <span class="brand">tagwerk</span>
      <button class="add-btn" id="addBtn" aria-label="Neue Gewohnheit">+</button>
    </header>

    <section class="hero">
      <p class="weekday" id="weekday"></p>
      <h1 class="date" id="date"></h1>
      <p class="status" id="status"></p>
    </section>

    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress">
      <div class="progress-fill" id="progressFill"></div>
      <span class="progress-label" id="progressLabel">0 %</span>
    </div>

    <section class="list" id="list"></section>
    <p class="empty" id="empty" hidden>Noch nichts geplant. Tippe auf +, um deine erste Gewohnheit anzulegen.</p>
  </main>

  <dialog id="dialog">
    <form method="dialog" id="form" class="sheet">
      <h2 id="dialogTitle">Neue Gewohnheit</h2>

      <label>Name
        <input type="text" id="fName" maxlength="28" placeholder="z. B. Lesen" required>
      </label>

      <label>Ziel
        <input type="text" id="fGoal" maxlength="32" placeholder="z. B. 20 Seiten">
      </label>

      <fieldset>
        <legend>Symbol</legend>
        <div class="icons" id="iconPicker"></div>
      </fieldset>

      <label>Wie oft pro Woche?
        <select id="fPerWeek"></select>
      </label>

      <div class="actions">
        <button type="button" class="btn danger" id="deleteBtn">Löschen</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancelBtn">Abbrechen</button>
        <button type="submit" class="btn primary" id="saveBtn">Speichern</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
